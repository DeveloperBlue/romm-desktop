name: Release

on:
  push:
    tags: ["v*"]
  # Manual packaging for the patch branch (or any ref). In the Actions UI, pick
  # developerblue/fix/pairing-patch, then Run workflow. Artifacts appear on
  # the run page when the job finishes; nothing is published unless this was a
  # tag push.
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: linux-appimage
          - os: windows-latest
            target: --win
            artifact: windows-zip
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder fetches the Electron distributions it packages, so the
      # npm postinstall copy would be downloaded and never used.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Package
        # Artifacts are uploaded below (and tagged releases use gh). Without
        # this, electron-builder sees CI and fails looking for GH_TOKEN.
        run: npm run package -- ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    # A manual run builds only: there is no tag to release against.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --draft \
            --notes "Builds are unsigned. Windows shows a SmartScreen warning. Review and edit these notes before publishing."
